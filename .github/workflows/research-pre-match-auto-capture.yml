name: Research Pre-Match Auto Capture

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Cartola season"
        required: false
        default: "2026"
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: research-pre-match-auto-capture-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prospective-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SEASON: ${{ github.event.inputs.season || '2026' }}
      PRE_MATCH_CAPTURE_WRITE_ENABLED: ${{ vars.PRE_MATCH_CAPTURE_WRITE_ENABLED || 'false' }}
      PRE_MATCH_CAPTURE_COMMIT_ENABLED: ${{ vars.PRE_MATCH_CAPTURE_COMMIT_ENABLED || 'false' }}
      BOT_NAME: slvs-research-capture-bot
      BOT_EMAIL: slvs-research-capture-bot@users.noreply.github.com
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate safe configuration
        run: |
          if [[ "$PRE_MATCH_CAPTURE_WRITE_ENABLED" != "true" || "$PRE_MATCH_CAPTURE_COMMIT_ENABLED" != "true" ]]; then
            echo "Safe mode active: capture will run as dry-run."
          fi

      - name: Run idempotent prospective scheduler
        id: capture
        shell: bash
        run: |
          set +e
          if [[ "$PRE_MATCH_CAPTURE_WRITE_ENABLED" == "true" && "$PRE_MATCH_CAPTURE_COMMIT_ENABLED" == "true" ]]; then
            npm --silent run research:auto-capture-pre-match -- --season="$SEASON" --json | tee "$RUNNER_TEMP/pre-match-result.json"
          else
            npm --silent run research:auto-capture-pre-match -- --season="$SEASON" --dry-run --json | tee "$RUNNER_TEMP/pre-match-result.json"
          fi
          CAPTURE_EXIT=${PIPESTATUS[0]}
          echo "exit_code=$CAPTURE_EXIT" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Emit capture alerts
        if: always()
        shell: bash
        run: |
          RISK="$(node -p "require(process.env.RUNNER_TEMP + '/pre-match-result.json').captureRisk || 'UNKNOWN'")"
          if [[ "$RISK" == "CAPTURE_AT_RISK" ]]; then
            echo "::warning title=Prospective capture at risk::No valid capture exists near the current deadline."
          fi
          if [[ "$RISK" == "MISSED_CAPTURE" ]]; then
            echo "::error title=Prospective capture missed::Market closed without a valid prospective capture. Retrospective reconstruction is forbidden."
          fi

      - name: Validate restricted persistence
        id: persistence
        if: always()
        shell: bash
        run: |
          set +e
          npm --silent run research:pre-match:persistence -- --season="$SEASON" --json | tee "$RUNNER_TEMP/pre-match-persistence.json"
          VALIDATION_EXIT=${PIPESTATUS[0]}
          STATUS="$(node -p "require(process.env.RUNNER_TEMP + '/pre-match-persistence.json').persistenceStatus")"
          echo "exit_code=$VALIDATION_EXIT" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Restricted commit and push
        if: env.PRE_MATCH_CAPTURE_WRITE_ENABLED == 'true' && env.PRE_MATCH_CAPTURE_COMMIT_ENABLED == 'true' && steps.persistence.outputs.status == 'READY_TO_COMMIT'
        shell: bash
        run: |
          ROUND="$(node -p "require(process.env.RUNNER_TEMP + '/pre-match-result.json').round")"
          CAPTURE_TYPE="$(node -p "require(process.env.RUNNER_TEMP + '/pre-match-result.json').captureType")"
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git add -- "data/research/$SEASON/pre-match-availability" "data/research/$SEASON/prospective-availability-controls.json"
          git diff --cached --quiet && exit 0
          git commit -m "chore(research): capture pre-match R${ROUND} ${CAPTURE_TYPE} [skip render]"
          git fetch origin
          git merge-base --is-ancestor "origin/${GITHUB_REF_NAME}" HEAD || {
            echo "Remote advanced; refusing unsafe push."
            exit 6
          }
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: GitHub Actions Summary
        if: always()
        run: node scripts/research-pre-match-workflow-summary.js "$RUNNER_TEMP/pre-match-result.json" "$RUNNER_TEMP/pre-match-persistence.json"

      - name: Enforce scheduler result
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.persistence.outputs.exit_code }}" != "0" ]]; then
            exit "${{ steps.persistence.outputs.exit_code }}"
          fi
          exit "${{ steps.capture.outputs.exit_code }}"
