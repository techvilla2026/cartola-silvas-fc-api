name: Research Pre-Match Auto Capture

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Cartola season"
        required: false
        default: "2026"
      activation_mode:
        description: "Safe activation mode"
        required: true
        type: choice
        default: "dry-run"
        options:
          - dry-run
          - preflight
          - live
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: research-pre-match-auto-capture-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prospective-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SEASON: ${{ github.event.inputs.season || '2026' }}
      PRE_MATCH_CAPTURE_WRITE_ENABLED: ${{ vars.PRE_MATCH_CAPTURE_WRITE_ENABLED || 'false' }}
      PRE_MATCH_CAPTURE_COMMIT_ENABLED: ${{ vars.PRE_MATCH_CAPTURE_COMMIT_ENABLED || 'false' }}
      BOT_NAME: slvs-research-capture-bot
      BOT_EMAIL: slvs-research-capture-bot@users.noreply.github.com
      ACTIVATION_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.activation_mode || 'scheduled' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate safe configuration
        id: configuration
        shell: bash
        run: |
          WRITE="$PRE_MATCH_CAPTURE_WRITE_ENABLED"
          COMMIT="$PRE_MATCH_CAPTURE_COMMIT_ENABLED"
          if [[ ( "$WRITE" == "true" && "$COMMIT" != "true" ) || ( "$WRITE" != "true" && "$COMMIT" == "true" ) ]]; then
            echo "::error title=Invalid activation configuration::Write and persistence must be enabled together."
            exit 7
          fi
          if [[ "$ACTIVATION_MODE" == "live" && ( "$WRITE" != "true" || "$COMMIT" != "true" ) ]]; then
            echo "::error title=Live activation blocked::Both repository variables must be exactly true."
            exit 7
          fi
          echo "Safe configuration validated for mode $ACTIVATION_MODE."

      - name: Run no-write activation preflight
        id: preflight
        if: env.ACTIVATION_MODE == 'preflight'
        shell: bash
        run: |
          set +e
          npm --silent run research:pre-match:preflight -- --season="$SEASON" --branch="$GITHUB_REF_NAME" --check-push --json | tee "$RUNNER_TEMP/pre-match-preflight.json"
          PREFLIGHT_EXIT=${PIPESTATUS[0]}
          echo "exit_code=$PREFLIGHT_EXIT" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run idempotent prospective scheduler
        id: capture
        if: env.ACTIVATION_MODE != 'preflight'
        shell: bash
        run: |
          set +e
          if [[ "$PRE_MATCH_CAPTURE_WRITE_ENABLED" == "true" && "$PRE_MATCH_CAPTURE_COMMIT_ENABLED" == "true" && ( "$ACTIVATION_MODE" == "live" || "$ACTIVATION_MODE" == "scheduled" ) ]]; then
            npm --silent run research:auto-capture-pre-match -- --season="$SEASON" --json | tee "$RUNNER_TEMP/pre-match-result.json"
          else
            npm --silent run research:auto-capture-pre-match -- --season="$SEASON" --dry-run --json | tee "$RUNNER_TEMP/pre-match-result.json"
          fi
          CAPTURE_EXIT=${PIPESTATUS[0]}
          echo "exit_code=$CAPTURE_EXIT" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Emit capture alerts
        if: always() && env.ACTIVATION_MODE != 'preflight'
        shell: bash
        run: |
          RISK="$(node -p "require(process.env.RUNNER_TEMP + '/pre-match-result.json').captureRisk || 'UNKNOWN'")"
          if [[ "$RISK" == "CAPTURE_AT_RISK" ]]; then
            echo "::warning title=Prospective capture at risk::No valid capture exists near the current deadline."
          fi
          if [[ "$RISK" == "MISSED_CAPTURE" ]]; then
            echo "::error title=Prospective capture missed::Market closed without a valid prospective capture. Retrospective reconstruction is forbidden."
          fi

      - name: Validate restricted persistence
        id: persistence
        if: always() && env.ACTIVATION_MODE != 'preflight'
        shell: bash
        run: |
          set +e
          npm --silent run research:pre-match:persistence -- --season="$SEASON" --json | tee "$RUNNER_TEMP/pre-match-persistence.json"
          VALIDATION_EXIT=${PIPESTATUS[0]}
          STATUS="$(node -p "require(process.env.RUNNER_TEMP + '/pre-match-persistence.json').persistenceStatus")"
          echo "exit_code=$VALIDATION_EXIT" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Restricted commit and push
        if: env.ACTIVATION_MODE != 'preflight' && env.PRE_MATCH_CAPTURE_WRITE_ENABLED == 'true' && env.PRE_MATCH_CAPTURE_COMMIT_ENABLED == 'true' && steps.persistence.outputs.status == 'READY_TO_COMMIT'
        shell: bash
        run: |
          ROUND="$(node -p "require(process.env.RUNNER_TEMP + '/pre-match-result.json').round")"
          CAPTURE_TYPE="$(node -p "require(process.env.RUNNER_TEMP + '/pre-match-result.json').captureType")"
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git add -- "data/research/$SEASON/pre-match-availability" "data/research/$SEASON/prospective-availability-controls.json"
          git diff --cached --quiet && exit 0
          git commit -m "chore(research): capture pre-match R${ROUND} ${CAPTURE_TYPE} [skip render]"
          git fetch origin
          git merge-base --is-ancestor "origin/${GITHUB_REF_NAME}" HEAD || {
            echo "Remote advanced; refusing unsafe push."
            exit 6
          }
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: GitHub Actions Summary
        if: always() && env.ACTIVATION_MODE != 'preflight'
        run: node scripts/research-pre-match-workflow-summary.js "$RUNNER_TEMP/pre-match-result.json" "$RUNNER_TEMP/pre-match-persistence.json"

      - name: Preflight Summary
        if: always() && env.ACTIVATION_MODE == 'preflight'
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const file = process.env.RUNNER_TEMP + '/pre-match-preflight.json';
          const result = fs.existsSync(file) ? JSON.parse(fs.readFileSync(file, 'utf8')) : {};
          const rows = {
            projectVersion: result.projectVersion || '5.2.15',
            activationMode: 'preflight',
            ok: result.ok ?? false,
            writeEnabled: process.env.PRE_MATCH_CAPTURE_WRITE_ENABLED === 'true',
            persistenceEnabled: process.env.PRE_MATCH_CAPTURE_COMMIT_ENABLED === 'true',
            directPushAllowed: result.pushReadiness?.directPushAllowed ?? null,
            allowlistValid: result.checks?.allowlistValid ?? false,
            unexpectedFileBlocked: result.checks?.unexpectedFileBlocked ?? false,
            filesChanged: result.filesChanged || [],
            commitCreated: false,
            captureCreated: false,
            blockingIssues: result.blockingIssues || []
          };
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Prospective Capture Activation Preflight\n\n${Object.entries(rows).map(([k,v]) => `- ${k}: ${typeof v === 'object' ? JSON.stringify(v) : v}`).join('\n')}\n`);
          NODE

      - name: Enforce scheduler result
        if: always()
        shell: bash
        run: |
          if [[ "$ACTIVATION_MODE" == "preflight" ]]; then
            exit "${{ steps.preflight.outputs.exit_code }}"
          fi
          if [[ "${{ steps.persistence.outputs.exit_code }}" != "0" ]]; then
            exit "${{ steps.persistence.outputs.exit_code }}"
          fi
          exit "${{ steps.capture.outputs.exit_code }}"
